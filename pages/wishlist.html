<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist — HelloKitty</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Smartsupp Live Chat script -->

  <style>
    .wishlist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }

    .wishlist-empty {
      text-align: center; padding: 100px 40px;
    }
    .wishlist-empty i { font-size: 72px; color: var(--amber); opacity: 0.25; display: block; margin-bottom: 24px; }
    .wishlist-empty h2 { margin-bottom: 12px; }
    .wishlist-empty p { margin-bottom: 32px; }

    /* Remove button on card */
    .wl-remove {
      position: absolute; top: 12px; right: 12px; z-index: 3;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer; font-size: 14px; color: #E53E3E;
      transition: var(--transition); box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .wl-remove:hover { background: #E53E3E; color: #fff; }

    .wishlist-header-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;
    }
    .clear-wishlist {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      background: none; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px 18px; cursor: pointer; transition: var(--transition);
    }
    .clear-wishlist:hover { border-color: #E53E3E; color: #E53E3E; }

    @media (max-width: 1024px) { .wishlist-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .wishlist-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<script src="../js/main.js"></script>
<script>document.write(navHTML('../'));</script>
<script>document.write(cartDrawerHTML());</script>
<script>document.write(mobileDrawerHTML('../'));</script>

<!-- PAGE HERO -->
<section class="page-hero">
  <div class="container">
    <nav class="breadcrumb">
      <a href="../index.html">Home</a>
      <span><i class="fa-solid fa-chevron-right" style="font-size:9px"></i></span>
      <span class="current">My Wishlist</span>
    </nav>
    <div class="label-chip"><i class="fa-solid fa-heart"></i> Saved</div>
    <h1 class="page-hero-title">My <em style="font-style:italic;color:var(--amber)">Wishlist</em></h1>
    <p class="page-hero-sub">Kittens and accessories you've saved. Don't wait too long — popular kittens go fast!</p>
  </div>
</section>

<section class="section" style="padding-top: 60px;">
  <div class="container" id="wishlist-container">
    <!-- Rendered by JS -->
  </div>
</section>

<script>document.write(footerHTML('../'));</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  initNav(); initReveal(); Cart.badge();

  function renderWishlist() {
    const container = document.getElementById('wishlist-container');
    const wishedIds = Wishlist.items;

    if (!wishedIds.length) {
      container.innerHTML = `
        <div class="wishlist-empty">
          <i class="fa-regular fa-heart"></i>
          <h2>Your wishlist is empty</h2>
          <p>Browse our kittens and accessories and tap the heart to save your favourites.</p>
          <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
            <a href="shop.html" class="btn btn-primary btn-lg">Browse Kittens <i class="fa-solid fa-arrow-right"></i></a>
            <a href="accessories.html" class="btn btn-outline btn-lg">Shop Accessories</a>
          </div>
        </div>`;
      return;
    }

    const wishedCats = CATS.filter(c => wishedIds.includes(c.id));
    const wishedAcc = (typeof ACCESSORIES !== 'undefined' ? ACCESSORIES : []).filter(a => wishedIds.includes(a.id));
    const all = [...wishedCats, ...wishedAcc];

    container.innerHTML = `
      <div class="wishlist-header-bar">
        <p style="color:var(--text-muted);font-size:14px"><strong style="color:var(--brown-deep)">${all.length}</strong> saved item${all.length !== 1 ? 's' : ''}</p>
        <button class="clear-wishlist" id="clear-wl"><i class="fa-solid fa-trash-can"></i> Clear All</button>
      </div>
      <div class="wishlist-grid" id="wl-grid">
        ${wishedCats.map(cat => `
          <article class="cat-card" style="position:relative">
            <div class="cat-card-img-wrap">
              <img src="${cat.img}" alt="${cat.name}" class="cat-card-img" loading="lazy">
              ${cat.tag ? `<span class="cat-tag cat-tag-${cat.tag.toLowerCase()}">${cat.tag}</span>` : ''}
              <button class="wl-remove" onclick="removeFromWishlist(${cat.id})" aria-label="Remove from wishlist">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
            <div class="cat-card-body">
              <div class="cat-card-top">
                <div class="cat-card-name">${cat.name}</div>
                <div class="cat-card-price">$${cat.price.toLocaleString()}</div>
              </div>
              <div class="cat-card-meta">${cat.breed} · ${cat.gender} · ${cat.age}</div>
              <p class="cat-card-desc">${cat.desc}</p>
              <div class="cat-badges">
                ${cat.vaccinated ? '<span class="badge badge-green"><i class="fa-solid fa-shield-virus"></i> Vaccinated</span>' : ''}
                ${cat.microchipped ? '<span class="badge badge-amber"><i class="fa-solid fa-microchip"></i> Microchipped</span>' : ''}
              </div>
              <div style="display:flex;gap:10px;">
                <button class="btn btn-primary" style="flex:1;justify-content:center"
                  onclick="Cart.add(${JSON.stringify(cat).replace(/"/g,'&quot;')})">
                  <i class="fa-solid fa-bag-shopping"></i> Add to Cart
                </button>
                <a href="cat-detail.html?id=${cat.id}" class="btn btn-outline" style="padding:14px 16px"><i class="fa-solid fa-eye"></i></a>
              </div>
            </div>
          </article>`).join('')}
        ${wishedAcc.map(acc => `
          <div class="cat-card" style="position:relative">
            <div class="cat-card-img-wrap">
              <img src="${acc.img}" alt="${acc.name}" class="cat-card-img" loading="lazy">
              <span class="cat-tag" style="background:rgba(196,122,53,0.9);color:#fff;position:absolute;top:12px;left:12px;font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:0.5px;">${acc.category}</span>
              <button class="wl-remove" onclick="removeFromWishlist(${acc.id})" aria-label="Remove">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
            <div class="cat-card-body">
              <div class="cat-card-top">
                <div class="cat-card-name">${acc.name}</div>
                <div class="cat-card-price">$${acc.price}</div>
              </div>
              <p class="cat-card-desc">${acc.desc}</p>
              <button class="btn btn-primary" style="width:100%;justify-content:center"
                onclick="Cart.add(${JSON.stringify(acc).replace(/"/g,'&quot;')})">
                <i class="fa-solid fa-bag-shopping"></i> Add to Cart
              </button>
            </div>
          </div>`).join('')}
      </div>`;

    document.getElementById('clear-wl').addEventListener('click', () => {
      Wishlist.items = []; Wishlist.save();
      showToast('Wishlist cleared.', 'info');
      renderWishlist();
    });
  }

  window.removeFromWishlist = function(id) {
    Wishlist.items = Wishlist.items.filter(x => x !== id);
    Wishlist.save();
    showToast('Removed from wishlist.', 'info');
    renderWishlist();
  };

  renderWishlist();
});
</script>
</body>
</html>
